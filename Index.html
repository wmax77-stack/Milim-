<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מילון שלי">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12141C">
<title>מילון שלי — מילים והגייה</title>
<style>
  :root{
    --bg:#F5F4F0;
    --ink:#15151B;
    --ink-soft:#5B5B66;
    --card:#FFFFFF;
    --line:#E7E5DE;
    --accent:#2F4BD1;
    --accent-ink:#FFFFFF;
    --wave:#0E9B8A;
    --danger:#D1442F;
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    overscroll-behavior:none;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    max-width:560px; margin:0 auto;
    position:relative;
  }
  header{
    padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    background:rgba(245,244,240,0.85);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
  }
  header h1{ margin:0; font-size:30px; font-weight:800; letter-spacing:-0.02em; }
  header p{ margin:4px 0 0; font-size:13px; color:var(--ink-soft); }
  .count-badge{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:12px; font-weight:600;
    background:var(--ink); color:var(--bg);
    border-radius:999px; padding:2px 9px; margin-inline-start:8px;
  }
  .speed-toggle{
    display:inline-flex; gap:4px; margin-top:10px;
    background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:3px;
  }
  .speed-btn{
    border:none; background:transparent; color:var(--ink-soft);
    font-size:13px; font-weight:600; padding:5px 14px; border-radius:999px;
    cursor:pointer; font-family:inherit;
  }
  .speed-btn.active{ background:var(--accent); color:var(--accent-ink); }
  main{ flex:1; overflow-y:auto; padding:16px 16px 12px; -webkit-overflow-scrolling:touch; }
  .empty{ text-align:center; color:var(--ink-soft); padding:70px 20px 20px; font-size:15px; line-height:1.7; }
  .empty .glyph{ font-size:40px; display:block; margin-bottom:10px; opacity:.5; }
  ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  li{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 14px; display:flex; align-items:center; gap:12px; animation:pop .25s ease;
  }
  @keyframes pop{ from{ transform:scale(.94); opacity:0;} to{ transform:scale(1); opacity:1; } }
  .word-block{ flex:1; min-width:0; }
  .word-idx{
    direction:ltr; display:inline-block;
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:11px; color:var(--ink-soft); margin-bottom:2px;
  }
  .word-en{
    direction:ltr; text-align:start; font-size:19px; font-weight:700; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .word-he{
    direction:rtl; text-align:start; font-size:14px; color:var(--ink-soft); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .speak-btn{
    flex-shrink:0; width:46px; height:46px; border-radius:50%;
    border:none; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
  }
  .speak-btn:active{ transform:scale(0.92); }
  .speak-btn svg{ width:20px; height:20px; }
  .wave-bars{ display:none; align-items:flex-end; gap:2px; height:16px; }
  .speak-btn.playing .icon{ display:none; }
  .speak-btn.playing .wave-bars{ display:flex; }
  .wave-bars span{
    display:block; width:3px; background:var(--accent-ink);
    border-radius:2px; animation:bounce 0.9s ease-in-out infinite;
  }
  .wave-bars span:nth-child(1){ animation-delay:0s; }
  .wave-bars span:nth-child(2){ animation-delay:0.15s; }
  .wave-bars span:nth-child(3){ animation-delay:0.3s; }
  .wave-bars span:nth-child(4){ animation-delay:0.45s; }
  @keyframes bounce{ 0%,100%{ height:4px; } 50%{ height:16px; } }
  .del-btn{
    flex-shrink:0; width:36px; height:36px; border-radius:50%;
    border:none; background:transparent; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .del-btn:active{ background:var(--line); }
  .del-btn svg{ width:17px; height:17px; }
  footer{
    padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
    background:rgba(245,244,240,0.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
  }
  form{ display:flex; flex-direction:column; gap:8px; }
  .input-row{ display:flex; flex-direction:column; gap:6px; }
  input[type="text"]{
    width:100%; font-size:17px; padding:12px 16px;
    border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); outline:none;
  }
  input#wordInput{ direction:ltr; text-align:start; }
  input#meaningInput{ direction:rtl; text-align:start; }
  input[type="text"]:focus{ border-color:var(--accent); }
  .field-label{ font-size:11px; color:var(--ink-soft); margin-inline-start:6px; font-weight:600; }
  button.add-btn{
    width:100%; padding:13px; border-radius:14px;
    border:none; background:var(--ink); color:var(--bg);
    font-size:16px; font-weight:700; cursor:pointer;
  }
  button.add-btn:disabled{ opacity:.35; }
  button.add-btn:active:not(:disabled){ transform:scale(0.98); }
  .hint{ font-size:12px; color:var(--ink-soft); margin:2px 4px 0; min-height:16px; }
  .hint.warn{ color:var(--danger); }
  ::selection{ background:var(--accent); color:#fff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>המילים שלי<span class="count-badge" id="countBadge">0</span></h1>
    <p>הקלד/י מילה באנגלית והפירוש בעברית, ולחצ/י על כפתור הרמקול כדי לשמוע הגייה</p>
    <div class="speed-toggle" role="group" aria-label="קצב הקראה">
      <button type="button" class="speed-btn active" id="speedSlow" data-rate="0.55">איטי</button>
      <button type="button" class="speed-btn" id="speedNormal" data-rate="0.85">רגיל</button>
    </div>
  </header>

  <main>
    <ul id="wordList"></ul>
    <div class="empty" id="emptyState">
      <span class="glyph">🔤</span>
      עדיין אין מילים ברשימה.<br>הוסיפ/י מילה ראשונה למטה 👇
    </div>
  </main>

  <footer>
    <form id="addForm" autocomplete="off">
      <div class="input-row">
        <span class="field-label">מילה באנגלית</span>
        <input type="text" id="wordInput" placeholder="לדוגמה: apple" maxlength="40" inputmode="text">
      </div>
      <div class="input-row">
        <span class="field-label">פירוש בעברית (לא חובה)</span>
        <input type="text" id="meaningInput" placeholder="לדוגמה: תפוח" maxlength="60" inputmode="text">
      </div>
      <button type="submit" class="add-btn" id="addBtn" disabled>הוסף/י לרשימה</button>
    </form>
    <div class="hint" id="hint"></div>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY_V2 = "myWordsApp.words.v2";
  var STORAGE_KEY_V1 = "myWordsApp.words.v1";

  var listEl = document.getElementById("wordList");
  var emptyEl = document.getElementById("emptyState");
  var countBadge = document.getElementById("countBadge");
  var form = document.getElementById("addForm");
  var input = document.getElementById("wordInput");
  var meaningInput = document.getElementById("meaningInput");
  var addBtn = document.getElementById("addBtn");
  var hintEl = document.getElementById("hint");

  var VALID_ENGLISH = /^[A-Za-z][A-Za-z '\-]{0,39}$/;
  var VALID_HEBREW = /^[\u0590-\u05FF0-9 ,'"\-.!?״׳]{0,60}$/;

  function sanitizeEnglish(raw){
    var w = String(raw).trim().replace(/\s+/g," ");
    if(!VALID_ENGLISH.test(w)) return null;
    return w;
  }
  function sanitizeHebrew(raw){
    var w = String(raw).trim().replace(/\s+/g," ");
    if(w === "") return "";
    if(!VALID_HEBREW.test(w)) return null;
    return w;
  }

  function normalizeEntry(entry){
    if(!entry || typeof entry !== "object") return null;
    var en = sanitizeEnglish(entry.en);
    if(!en) return null;
    var he = sanitizeHebrew(entry.he || "");
    if(he === null) he = "";
    return { en: en, he: he };
  }

  function loadWords(){
    try{
      var rawV2 = localStorage.getItem(STORAGE_KEY_V2);
      if(rawV2){
        var parsed = JSON.parse(rawV2);
        if(!Array.isArray(parsed)) return [];
        return parsed.map(normalizeEntry).filter(Boolean).slice(0,500);
      }
      var rawV1 = localStorage.getItem(STORAGE_KEY_V1);
      if(rawV1){
        var arr = JSON.parse(rawV1);
        if(Array.isArray(arr)){
          var migrated = arr
            .filter(function(w){ return typeof w === "string"; })
            .map(function(w){ return { en: sanitizeEnglish(w), he: "" }; })
            .filter(function(w){ return w.en; })
            .slice(0,500);
          saveWords(migrated);
          return migrated;
        }
      }
      return [];
    }catch(e){
      return [];
    }
  }

  function saveWords(list){
    try{
      localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(list.slice(0,500)));
    }catch(e){
      console.warn("Could not persist words:", e);
    }
  }

  var words = loadWords();

  var chosenVoice = null;
  var voicesReadyPromise = null;
  var speechRate = 0.55;

  function getVoicesAsync(){
    if(voicesReadyPromise) return voicesReadyPromise;
    voicesReadyPromise = new Promise(function(resolve){
      var voices = window.speechSynthesis.getVoices();
      if(voices && voices.length){ resolve(voices); return; }
      var done = false;
      function finish(){
        if(done) return;
        done = true;
        window.speechSynthesis.removeEventListener("voiceschanged", finish);
        resolve(window.speechSynthesis.getVoices());
      }
      window.speechSynthesis.addEventListener("voiceschanged", finish);
      setTimeout(finish, 1200);
    });
    return voicesReadyPromise;
  }

  function scoreVoice(v){
    var n = v.name.toLowerCase();
    var score = /^en/i.test(v.lang) ? 100 : 0;
    if(n.indexOf("enhanced") !== -1 || n.indexOf("premium") !== -1) score += 60;
    var femaleNames = ["samantha","ava","allison","susan","victoria","karen","serena","kate","moira","tessa","fiona","zoe","joanna","salli","zira","siri female","female"];
    for(var i=0;i<femaleNames.length;i++){
      if(n.indexOf(femaleNames[i]) !== -1){ score += (femaleNames.length - i); break; }
    }
    var maleNames = ["male","daniel","alex","fred","aaron","arthur","oliver","gordon","tom","david","siri male"];
    for(var j=0;j<maleNames.length;j++){
      if(n.indexOf(maleNames[j]) !== -1){ score -= 200; break; }
    }
    return score;
  }

  function pickFemaleVoice(voices){
    if(!voices || !voices.length) return null;
    return voices.slice().sort(function(a,b){ return scoreVoice(b) - scoreVoice(a); })[0];
  }

  async function ensureVoice(){
    if(chosenVoice) return chosenVoice;
    var voices = await getVoicesAsync();
    chosenVoice = pickFemaleVoice(voices);
    return chosenVoice;
  }
  if("speechSynthesis" in window) ensureVoice();

  async function speak(word, btnEl){
    if(!("speechSynthesis" in window)){
      hintEl.textContent = "הדפדפן הזה לא תומך בהקראה קולית.";
      hintEl.className = "hint warn";
      return;
    }
    var voice = await ensureVoice();
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(word + ".");
    utter.lang = "en-US";
    utter.rate = speechRate;
    utter.pitch = 1.0;
    utter.volume = 1.0;
    if(voice) utter.voice = voice;

    btnEl.classList.add("playing");
    utter.onend = function(){ btnEl.classList.remove("playing"); };
    utter.onerror = function(){ btnEl.classList.remove("playing"); };
    window.speechSynthesis.speak(utter);
  }

  function render(){
    listEl.innerHTML = "";
    countBadge.textContent = words.length;
    emptyEl.style.display = words.length ? "none" : "block";

    words.forEach(function(entry, i){
      var li = document.createElement("li");

      var wordBlock = document.createElement("div");
      wordBlock.className = "word-block";

      var idx = document.createElement("div");
      idx.className = "word-idx";
      idx.textContent = "#" + String(i+1).padStart(2,"0");

      var wordEn = document.createElement("div");
      wordEn.className = "word-en";
      wordEn.textContent = entry.en;

      wordBlock.appendChild(idx);
      wordBlock.appendChild(wordEn);

      if(entry.he){
        var wordHe = document.createElement("div");
        wordHe.className = "word-he";
        wordHe.textContent = entry.he;
        wordBlock.appendChild(wordHe);
      }

      var speakBtn = document.createElement("button");
      speakBtn.className = "speak-btn";
      speakBtn.setAttribute("aria-label", "השמע הגייה של " + entry.en);
      speakBtn.innerHTML =
        '<span class="icon">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-.77-3.29-2-4.32v8.63c1.23-1.02 2-2.54 2-4.31z"/></svg>' +
        '</span>' +
        '<span class="wave-bars"><span></span><span></span><span></span><span></span></span>';
      speakBtn.addEventListener("click", function(){ speak(entry.en, speakBtn); });

      var delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.setAttribute("aria-label", "מחק את " + entry.en);
      delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
      delBtn.addEventListener("click", function(){
        words.splice(i,1);
        saveWords(words);
        render();
      });

      li.appendChild(wordBlock);
      li.appendChild(speakBtn);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });
  }

  function currentValidation(){
    var en = sanitizeEnglish(input.value);
    var he = sanitizeHebrew(meaningInput.value);
    return { en: en, he: he };
  }

  function updateAddButton(){
    var v = currentValidation();
    addBtn.disabled = !(v.en && v.he !== null);
  }

  input.addEventListener("input", function(){
    updateAddButton();
    hintEl.textContent = ""; hintEl.className = "hint";
  });
  meaningInput.addEventListener("input", function(){
    updateAddButton();
    hintEl.textContent = ""; hintEl.className = "hint";
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var v = currentValidation();
    if(!v.en){
      hintEl.textContent = "אפשר להזין במילה האנגלית רק אותיות (וגם רווח, מקף או גרש).";
      hintEl.className = "hint warn";
      return;
    }
    if(v.he === null){
      hintEl.textContent = "בשדה הפירוש בעברית אפשר להזין רק עברית, מספרים וסימני פיסוק בסיסיים.";
      hintEl.className = "hint warn";
      return;
    }
    var exists = words.some(function(w){ return w.en.toLowerCase() === v.en.toLowerCase(); });
    if(exists){
      hintEl.textContent = "המילה \"" + v.en + "\" כבר ברשימה.";
      hintEl.className = "hint warn";
      input.select();
      return;
    }
    words.unshift({ en: v.en, he: v.he });
    saveWords(words);
    render();
    input.value = "";
    meaningInput.value = "";
    updateAddButton();
    hintEl.textContent = "";
    input.focus();
  });

  var speedSlow = document.getElementById("speedSlow");
  var speedNormal = document.getElementById("speedNormal");
  function setSpeed(btn){
    speechRate = parseFloat(btn.getAttribute("data-rate"));
    [speedSlow, speedNormal].forEach(function(b){ b.classList.toggle("active", b === btn); });
  }
  speedSlow.addEventListener("click", function(){ setSpeed(speedSlow); });
  speedNormal.addEventListener("click", function(){ setSpeed(speedNormal); });

  render();
  updateAddButton();
})();
</script>
</body>
</html>
